name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  graphics-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/graphics
          push: false
          load: true
          tags: modavis-scriptor-graphics:test
      - run: docker run --detach --name graphics-test --publish 127.0.0.1:8310:8010 modavis-scriptor-graphics:test
      - run: python3 scripts/graphics/test-api.py http://127.0.0.1:8310
