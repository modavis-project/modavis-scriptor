name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/graphics/requirements.lock
      - run: npm ci
      - name: Lint, types, production build, dependency audit
        run: npm run check
      - name: Locked Python environment and audit
        run: |
          python -m pip install -r services/graphics/requirements.lock pip-audit==2.10.1
          python -m pip check
          pip-audit --requirement services/graphics/requirements.lock --disable-pip --no-deps --progress-spinner off
      - name: API contract generation and runtime validation
        run: |
          python scripts/contracts/generate.py --check
          python scripts/contracts/test-models.py
          npm run test:contracts
      - name: Frozen evidence, models, corpus and evaluation
        run: |
          python scripts/graphics/verify-assets.py
          npm run test:evaluation
          npm run test:dev
          python scripts/dev/test-processes.py

  linux-containers:
    needs: quality
    name: Linux ${{ matrix.arch }} containers and three browsers
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@v3
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: browsers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Build graphics image with dependency cache
        uses: docker/build-push-action@v6
        with:
          context: services/graphics
          load: true
          tags: modavis-scriptor-graphics:development-test
          cache-from: type=gha,scope=graphics-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=graphics-${{ matrix.arch }}
      - name: Build web image with dependency cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: modavis-scriptor:development-test
          cache-from: type=gha,scope=web-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=web-${{ matrix.arch }}
      - name: Isolated integrity, recovery, OCR, API and browser acceptance
        run: python scripts/dev/validate.py --no-build --log-dir test-results/service-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ matrix.arch }}-validation
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  windows-native:
    needs: quality
    name: Windows native Python, contracts, OCR and browsers
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/graphics/requirements.lock
      - run: npm ci
      - name: Install verified pinned Tesseract engine
        shell: pwsh
        run: ./.github/scripts/install-tesseract.ps1
      - name: Prepare locked Python and verified language models
        run: python scripts/dev/setup-native.py
      - name: Windows host and contract checks
        run: |
          npm run check
          npm run test:evaluation
          npm run test:dev
          python scripts/dev/test-processes.py
          services/graphics/.venv/Scripts/python.exe scripts/contracts/generate.py --check
          services/graphics/.venv/Scripts/python.exe scripts/contracts/test-models.py
          npm run test:contracts
          npm run doctor -- --native
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/ms-playwright
          key: browsers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium firefox webkit
      - name: Isolated native backend, recovery, OCR, API and browser acceptance
        run: python scripts/dev/validate.py --native --no-build --log-dir test-results/service-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-validation
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
