name: modavis-scriptor-development

services:
  graphics:
    build:
      context: ./services/graphics
    image: modavis-scriptor-graphics:development
    init: true
    ports:
      - "127.0.0.1:${SCRIPTOR_DEV_API_PORT:-8410}:8010"
    volumes:
      - graphics-dev-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 12

volumes:
  graphics-dev-data:
